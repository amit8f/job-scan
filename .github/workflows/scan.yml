name: Job scan

on:
  schedule:
    # every 2 hours from 05:17 to 17:17 UTC (about 07:00 to 20:00 in Israel), at minute 17 to avoid the busy top of the hour
    - cron: '17 5-17/2 * * *'
  workflow_dispatch: {}

# never run two scans at once, they share scan/seen.json
concurrency:
  group: job-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Full sweep
        run: bash scan/run_scan.sh "$RUNNER_TEMP/work"

      - name: Send new postings to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py "$RUNNER_TEMP/work/new_candidates.json"

      # Saved only after Telegram succeeded, so a failed send is retried on the next run.
      - name: Remember what we have seen
        run: |
          git config user.name "job-scan-bot"
          git config user.email "job-scan-bot@users.noreply.github.com"
          git add scan/seen.json
          git diff --cached --quiet || git commit -m "Update seen postings"
          git push
